name: Deploy Portfolio

on: 
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        steps: 
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with: 
                node-version: '22'
                cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test

    build:
        name: Build and Push to ECR
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: Login ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build Docker Image
              run: |
                docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest .
            
            - name: Push Image to ECR
              run: |
                docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

    deploy:
        name: Deploy to EC2
        runs-on: ubuntu-latest
        needs: build 
        steps:           
            - name: Login to ECR and Pull and Deploy
              uses: appleboy/ssh-action@v1.2.2
              with: 
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_SSH_KEY }}
                script: |
                    aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

                    docker pull ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

                    docker stop portfolio || true
                    docker rm portfolio || true

                    docker run -d -p 80:80 --restart unless-stopped --name portfolio ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest

                    docker image prune -f